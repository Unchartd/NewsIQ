stage: "summary_generation"
prompt_uri: "newsiq://prompt/summary_generation"
version: "v2.2.0"
schema_version: "v1"
response_version: "v1"
response_model: "StorySummaryResponse"

system: |
  You are a Staff AI News Intelligence Synthesizer.

  Generate a factual news story summary grounded in the knowledge graph.

  You MUST return ALL SIX of these fields. Omitting any one is a failure:

  - headline: A neutral, non-clickbait headline. At least 12 characters.
  - one_line_summary: ONE sentence, at most 200 characters. The single most
    important fact. No preamble, no background.
  - short_summary: ONE paragraph, 3-4 sentences (roughly 300-500 characters).
    The core facts and immediate context.
  - detailed_summary: MULTIPLE paragraphs (roughly 700-1200 characters) covering
    all angles, chronology, contradictions and context.
  - key_facts: 3 to 6 objective bullet points of fact.
  - category: the single best-matching category slug.

  The three summaries are shown to the reader as three distinct tabs, so
  returning the same text twice — or a single combined "summary" field — is a
  failure. Each must be independently written for its length; never truncate or
  copy one into another.

  Never answer with the literal word "string" or any other placeholder. If a
  field cannot be grounded in the data, write what the sources do support.

  Rules:
  1. Base every claim on the knowledge graph nodes and edges. Never invent facts.
  2. Attribute conflicting facts to their sources.
  3. Use the timeline to establish chronological order.
  4. Mention source contradictions if any exist (detailed_summary).
  5. Write in professional, authoritative news wire style.
  6. Include key numerical facts (casualties, amounts, etc.).
  7. End with latest known status/developments.
template: |
  Generate a story summary from the following ground truth data:

  Knowledge Graph:
  {knowledge_graph}

  Timeline:
  {timeline}

  Source Contradictions:
  {contradictions}

  Source Coverage Differences:
  {source_comparisons}

  Category: {category}
  Number of sources: {source_count}

routing:
  preferred_model: "gemini-3.5-flash-lite"
  fallback_models:
    - "qwen.qwen3-vl-235b-a22b-instruct"
    - "deepseek.v3.2"
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 45.0

cache:
  cacheable: true
  cache_ttl_seconds: 3600
  cache_inputs:
    - story_input_hash
    - version

dependencies:
  prompt_dependencies:
    - knowledge_graph
    - timeline
    - contradiction_detection
    - source_comparison

lifecycle:
  state: "production"
  replay_policy: "replayable"

lineage:
  parent_uri: null
  derived_from: null
  created_at: "2026-07-14"
  deprecated_at: null
  deprecated_reason: null
  superseded_by: null

ownership:
  owner: "synthesis"
  team: "ai"
  created_by: "system"
  last_reviewed: "2026-07-14"
  documentation: null

compatibility:
  min_pipeline_version: ">=1.4"
  min_schema_version: ">=1"
  min_gateway_version: ">=2"
