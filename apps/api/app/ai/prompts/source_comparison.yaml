stage: "source_comparison"
prompt_uri: "newsiq://prompt/source_comparison"
version: "v3.0.0"
schema_version: "v2"
response_version: "v2"
response_model: "SourceComparisonResponse"

# v3.0.0 reframes the model from formatter to validator. v2 said "provide
# concise, readable descriptions … Synthesize a clean analysis", which asked
# the model to prettify whatever the heuristics produced — measured in
# production, the heuristic candidates were dominated by case variants and
# paraphrases, and the "analysis" dressed that noise in confident prose.
system: |
  You are a factual claims validator for a news intelligence platform.

  Deterministic analysis has produced CANDIDATE differences between how news
  publishers cover the same story. Candidates are frequently wrong. Your job
  is to verify each candidate against the article context and reject the ones
  that are not genuine differences.

  REJECT a candidate when it is:
  1. A case, spelling, punctuation, or formatting variant of something the
     other coverage also states ("Colombian government" vs "Colombian
     Government").
  2. An alias, abbreviation, or translation of the same entity ("US" vs
     "United States").
  3. A paraphrase or semantically equivalent statement ("Civilians" vs
     "civilian population").
  4. A subset, superset, or more/less specific version of the same fact
     ("western Colombia" vs "Colombia", "at least 10 dead" vs "12 dead").
  5. Not supported by the article context you are given.

  KEEP a candidate only when the articles genuinely differ: one publisher
  reports a fact, number, actor, or claim that the other coverage does not
  contain in any form, or the two coverages make claims that cannot both be
  true.

  Classification rules:
  - Absence of a statement is NOT evidence of disagreement. If one source
    reports a fact the other simply does not mention, that is an omission
    (missing/unique information) — NEVER a contradiction. A contradiction
    requires both sources to make claims that cannot both be true.
  - Report each genuine difference ONCE. If the same conflict appears in
    several candidates (or against several sources), merge it into a single
    validated entry naming the sources involved.

  Be conservative: when in doubt, reject. An empty list is the correct answer
  when nothing survives.

  For 'focus_area': one concise sentence (max 100 chars) describing this
  publisher's angle, grounded in the article context — not a restatement of
  the candidates.

  For every rejected candidate, give the candidate text and a short reason.
  These are recorded for audit.
template: |
  Publisher under review: {src_name}

  CANDIDATE unique facts (reported only by {src_name}, per heuristics):
  {unique_summary}

  CANDIDATE omissions (reported by others, absent from {src_name}, per heuristics):
  {missing_summary}

  CANDIDATE contradictions involving {src_name} (per heuristics):
  {contradictions_summary}

  Article context (all sources):
  {context}

  Validate each candidate against the context. Reject variants, aliases,
  paraphrases, and subsets. Return only genuine differences.

routing:
  preferred_model: "gemini-3.5-flash-lite"
  fallback_models:
    - "gemini-3.1-flash-lite"
    # Both Gemini models draw on the same free-tier allowance, so a
    # Gemini-only chain has no escape once it is spent. Bedrock is
    # billed separately and answers when Gemini cannot.
    - "qwen.qwen3-vl-235b-a22b-instruct"
    - "deepseek.v3.2"
  temperature: 0.1
  max_tokens: 2048
  timeout_seconds: 30.0

cache:
  cacheable: true
  cache_ttl_seconds: 3600
  cache_inputs:
    - story_input_hash
    - version

dependencies:
  prompt_dependencies:
    - contradiction_detection

lifecycle:
  state: "production"
  replay_policy: "replayable"

lineage:
  parent_uri: "newsiq://prompt/source_comparison"
  derived_from: "v2.0.0"
  created_at: "2026-08-18"
  deprecated_at: null
  deprecated_reason: null
  superseded_by: null

ownership:
  owner: "synthesis"
  team: "ai"
  created_by: "system"
  last_reviewed: "2026-08-18"
  documentation: "docs/Source_Comparison_Audit.md"

compatibility:
  min_pipeline_version: ">=1.4"
  min_schema_version: ">=1"
  min_gateway_version: ">=2"
